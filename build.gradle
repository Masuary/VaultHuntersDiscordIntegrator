buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
        repositories {
            maven {
                url = 'https://plugins.gradle.org/m2/'
            }
        }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.+', changing: true
    }
}

//Gradle Plugins
plugins {
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id 'java'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

def vaultJar = file(findProperty('vaultJarPath') ?: '/mnt/data/AI/docs/minecraft/artifacts/forge/1.18.2/the_vault-1.18.2-22.0.0-remastered.7209.jar')
if (!vaultJar.isFile() || !(vaultJar.name ==~ /the_vault-.+\.jar/)) {
    throw new GradleException("vaultJarPath must point at an existing the_vault-<version>.jar, got ${vaultJar}")
}
def vaultJarVersion = vaultJar.name.substring('the_vault-'.length(), vaultJar.name.length() - '.jar'.length())

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory = project.file('run/client')
        }

        server {
            workingDirectory = project.file('run/server')
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.dcintegration.json"
    config "mixins.${mod_id}.mc2discord.json"
    config "mixins.${mod_id}.sdlink.json"
    config "mixins.${mod_id}.vaulthunters.json"
}

repositories {
    maven { url = 'https://jitpack.io' }
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
    maven { url = 'https://cursemaven.com' }
    flatDir { dirs vaultJar.parentFile }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Vault Hunters is not on a public Maven: -PvaultJarPath=<the_vault-<version>.jar> picks the local jar.
    implementation fg.deobf("the_vault:the_vault:${vaultJarVersion}")
    implementation fg.deobf("curse.maven:dcintegration-324952:${dcintegration}")
    implementation fg.deobf("curse.maven:mc2discord-325235:${mc2discord}")
    implementation fg.deobf("curse.maven:simple-discord-link-bot-forge-fabric-spigot-541320:${sdlink}")
    implementation fg.deobf("curse.maven:curios-309927:4418032")
    compileOnly fg.deobf("curse.maven:create-328085:${create}")

    // MasuChatLink is not on CurseMaven yet: -Pmasuchatlink_jar=<path> picks the jar. MasuChatLinkEventListener uses its
    // API classes directly, so the build needs it; at runtime the listener is only registered when the mod is present.
    def masuChatLinkJar = files(providers.gradleProperty('masuchatlink_jar').getOrElse(
            '/mnt/data/Minecraft/Mods/MasuChatLink/build/libs/masuchatlink-1.3.0.jar'))
    compileOnly masuChatLinkJar
    testImplementation masuChatLinkJar

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all,-classfile,-processing', '-Werror'])
}
